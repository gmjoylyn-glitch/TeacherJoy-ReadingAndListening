<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎨 Color & Feelings Adventure</title>
    <style>
        /* ===== STYLING ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            background: linear-gradient(145deg, #1a2a3a, #2c4a5a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-wrapper {
            background: #fef9f0;
            border-radius: 60px 60px 30px 30px;
            padding: 30px 25px 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.7);
            border: 6px solid #e8c99b;
            position: relative;
        }

        /* Top banner */
        .banner {
            background: #ffd966;
            padding: 10px 18px;
            border-radius: 50px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #2d1b0e;
            margin-top: -50px;
            margin-bottom: 15px;
            border: 4px solid #b8860b;
            box-shadow: 0 6px 0 #b8860b;
        }

        .banner span {
            background: #2d1b0e;
            color: #ffd966;
            padding: 2px 14px;
            border-radius: 30px;
            margin: 0 5px;
        }

        h1 {
            text-align: center;
            font-size: 2.4rem;
            color: #3d2b1f;
            text-shadow: 4px 4px 0 #f4c542;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .sub {
            text-align: center;
            font-size: 1rem;
            color: #6b4f3a;
            background: #f5ede4;
            padding: 6px 16px;
            border-radius: 40px;
            display: inline-block;
            margin: 0 auto 15px;
            border: 2px dashed #b08d6a;
        }

        .sub-wrap {
            text-align: center;
        }

        /* Score & Level */
        .stats {
            display: flex;
            justify-content: space-between;
            background: #2d1b0e;
            padding: 12px 22px;
            border-radius: 60px;
            color: #f1faee;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 10px 0 18px;
            border: 3px solid #e9c46a;
            flex-wrap: wrap;
            gap: 8px;
        }

        .stats span {
            background: #4a3222;
            padding: 2px 18px;
            border-radius: 40px;
        }

        /* The coloring canvas (grid) */
        .canvas-container {
            background: #d9c9b0;
            padding: 20px 15px;
            border-radius: 40px;
            border: 5px solid #7f5539;
            margin-bottom: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            justify-content: center;
            margin: 0 auto;
        }

        .cell {
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            border: 4px solid #4a2c1b;
            background: #e8ddd0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 0 #4a2c1b;
            color: #3d2b1f;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
            min-height: 70px;
        }

        .cell:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #4a2c1b;
        }

        .cell.colored {
            border-color: #1f3a2b;
            box-shadow: 0 4px 0 #1f3a2b;
            transform: translateY(2px);
        }

        .cell.completed {
            animation: pop 0.4s ease;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Color palette (emotions) */
        .palette {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin: 15px 0 10px;
        }

        .color-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 5px solid #4a2c1b;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 0 #4a2c1b;
            color: #1a1a1a;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.3);
            line-height: 1.2;
            padding: 4px;
        }

        .color-btn:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #4a2c1b;
        }

        .color-btn.active {
            border: 5px solid #ffd700;
            box-shadow: 0 0 25px #ffd700, 0 8px 0 #4a2c1b;
            transform: scale(1.05);
        }

        .color-btn .emoji {
            font-size: 1.8rem;
        }
        .color-btn .label {
            font-size: 0.7rem;
            background: rgba(0,0,0,0.2);
            padding: 1px 8px;
            border-radius: 20px;
        }

        /* Message area */
        .message-box {
            background: #eddcd2;
            padding: 14px 18px;
            border-radius: 40px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #1d3557;
            border: 3px solid #b08d6a;
            min-height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 12px 0 15px;
        }

        /* Buttons */
        .controls {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background: #2d1b0e;
            color: #f1faee;
            border: none;
            padding: 14px 30px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 6px solid #7f5539;
            transition: 0.1s;
            font-family: inherit;
            letter-spacing: 0.5px;
        }

        .btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        .btn-green {
            background: #2a9d8f;
            border-bottom-color: #1f6d62;
        }

        .btn-orange {
            background: #e76f51;
            border-bottom-color: #b85a3f;
        }

        .btn-purple {
            background: #6d597a;
            border-bottom-color: #4a3a54;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            font-size: 0.85rem;
            color: #5c4033;
            background: #f5ede4;
            padding: 6px 12px;
            border-radius: 30px;
        }

        .footer a {
            color: #2a6b41;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="game-wrapper">

    <!-- Banner -->
    <div class="banner">
        🧠 Don't use textbooks, <span>turn learning into game!</span> 🎮
    </div>

    <h1>🎨 Color & Feelings</h1>
    <div class="sub-wrap">
        <div class="sub">🌈 Match the feeling to the color!</div>
    </div>

    <!-- Stats -->
    <div class="stats">
        <div>⭐ Score: <span id="scoreDisplay">0</span></div>
        <div>🎯 Level: <span id="levelDisplay">1</span></div>
        <div>✅ Colored: <span id="coloredDisplay">0/12</span></div>
    </div>

    <!-- The Coloring Grid -->
    <div class="canvas-container">
        <div class="grid" id="gridContainer">
            <!-- 12 cells will be generated by JavaScript -->
        </div>
    </div>

    <!-- Color Palette (Emotions) -->
    <div class="palette" id="paletteContainer">
        <!-- Buttons will be generated by JavaScript -->
    </div>

    <!-- Message -->
    <div class="message-box" id="messageBox">
        🖌️ Pick a feeling, then tap a blank square!
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="btn btn-green" id="newGameBtn">🔄 New Game</button>
        <button class="btn btn-purple" id="hintBtn">💡 Hint</button>
    </div>

    <div class="footer">
        🌟 Feelings: <strong>Happy</strong> · <strong>Sad</strong> · <strong>Angry</strong> · <strong>Calm</strong>
        &nbsp;|&nbsp; Made for Grade 4 🧒
    </div>
</div>

<script>
    // ============================================================
    //  GAME LOGIC  -  Color & Feelings Adventure
    //  For Grade 4 Students
    // ============================================================

    // ---------- DATA ----------
    // Each feeling has a color, an emoji, and a label.
    const FEELINGS = [
        { id: 'happy',   color: '#f4c542', emoji: '😊', label: 'Happy' },
        { id: 'sad',     color: '#4a8db7', emoji: '😢', label: 'Sad' },
        { id: 'angry',   color: '#e63946', emoji: '😡', label: 'Angry' },
        { id: 'calm',    color: '#6bbf8a', emoji: '😌', label: 'Calm' }
    ];

    // The "puzzle" tells us which feeling goes in each grid cell.
    // We'll generate this randomly each game.
    // 12 cells (4x3 grid) — each feeling appears 3 times.
    let puzzle = [];           // Array of feeling ids for each cell
    let cellStates = [];       // 'empty' or feeling id
    let selectedFeeling = null; // Currently selected feeling from palette
    let score = 0;
    let level = 1;
    let totalCells = 12;
    let coloredCount = 0;
    let gameComplete = false;

    // DOM elements
    const gridContainer = document.getElementById('gridContainer');
    const paletteContainer = document.getElementById('paletteContainer');
    const messageBox = document.getElementById('messageBox');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const levelDisplay = document.getElementById('levelDisplay');
    const coloredDisplay = document.getElementById('coloredDisplay');

    // ---------- HELPER FUNCTIONS ----------

    // Shuffle an array (Fisher-Yates)
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Generate a new puzzle: 3 of each feeling, shuffled
    function generatePuzzle() {
        let ids = [];
        FEELINGS.forEach(f => {
            for (let i = 0; i < 3; i++) {
                ids.push(f.id);
            }
        });
        return shuffleArray(ids);
    }

    // Update the stats display
    function updateStats() {
        scoreDisplay.textContent = score;
        levelDisplay.textContent = level;
        coloredDisplay.textContent = `${coloredCount}/${totalCells}`;
    }

    // Show a message
    function setMessage(text, isGood = true) {
        messageBox.textContent = text;
        messageBox.style.color = isGood ? '#1d3557' : '#b63a3a';
    }

    // Check if the player has colored all cells
    function checkCompletion() {
        if (coloredCount === totalCells) {
            gameComplete = true;
            // Bonus points!
            const bonus = 10 + level * 2;
            score += bonus;
            updateStats();
            setMessage(`🎉 AMAZING! You colored them all! +${bonus} bonus points! 🎉`, true);
            // Level up after a short delay
            setTimeout(() => {
                level++;
                setMessage(`🌟 Level ${level} starting! New puzzle!`, true);
                startNewRound();
            }, 2000);
            return true;
        }
        return false;
    }

    // ---------- RENDER FUNCTIONS ----------

    // Render the grid
    function renderGrid() {
        gridContainer.innerHTML = '';
        for (let i = 0; i < totalCells; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.index = i;

            // If the cell has a feeling assigned, show it
            if (cellStates[i] !== 'empty') {
                const feeling = FEELINGS.find(f => f.id === cellStates[i]);
                if (feeling) {
                    cell.style.background = feeling.color;
                    cell.textContent = feeling.emoji;
                    cell.classList.add('colored');
                }
            } else {
                cell.textContent = '?';
                cell.style.background = '#e8ddd0';
            }

            cell.addEventListener('click', () => onCellClick(i));
            gridContainer.appendChild(cell);
        }
    }

    // Render the palette (feeling buttons)
    function renderPalette() {
        paletteContainer.innerHTML = '';
        FEELINGS.forEach(feeling => {
            const btn = document.createElement('div');
            btn.className = 'color-btn';
            btn.style.background = feeling.color;
            btn.dataset.feeling = feeling.id;

            // Show emoji and label
            btn.innerHTML = `
                <span class="emoji">${feeling.emoji}</span>
                <span class="label">${feeling.label}</span>
            `;

            if (selectedFeeling === feeling.id) {
                btn.classList.add('active');
            }

            btn.addEventListener('click', () => onPaletteClick(feeling.id));
            paletteContainer.appendChild(btn);
        });
    }

    // Highlight a cell briefly (for hint)
    function flashCell(index) {
        const cells = gridContainer.children;
        if (index >= 0 && index < cells.length) {
            const cell = cells[index];
            cell.style.transform = 'scale(1.15)';
            cell.style.boxShadow = '0 0 30px gold';
            setTimeout(() => {
                cell.style.transform = '';
                cell.style.boxShadow = '';
            }, 600);
        }
    }

    // ---------- GAME ACTIONS ----------

    // Click on a palette color (select a feeling)
    function onPaletteClick(feelingId) {
        if (gameComplete) {
            setMessage('🎯 This round is done! Press "New Game" to play again.', false);
            return;
        }
        selectedFeeling = feelingId;
        renderPalette();
        const feeling = FEELINGS.find(f => f.id === feelingId);
        setMessage(`🖌️ Selected: ${feeling.emoji} ${feeling.label}. Tap a ? square to color it!`, true);
    }

    // Click on a grid cell
    function onCellClick(index) {
        if (gameComplete) {
            setMessage('🎯 Round complete! Press "New Game" for a fresh start.', false);
            return;
        }

        // If no feeling is selected
        if (!selectedFeeling) {
            setMessage('👆 First, pick a feeling from the circles above!', false);
            return;
        }

        // If the cell is already colored
        if (cellStates[index] !== 'empty') {
            setMessage('⛔ This square is already colored! Pick an empty one.', false);
            return;
        }

        // Check if the selected feeling matches the puzzle
        const correctFeeling = puzzle[index];
        if (selectedFeeling === correctFeeling) {
            // Correct! Color the cell.
            cellStates[index] = selectedFeeling;
            coloredCount++;
            score += 5;
            updateStats();

            // Update the grid
            renderGrid();

            // Pop animation
            const cells = gridContainer.children;
            if (cells[index]) {
                cells[index].classList.add('completed');
                setTimeout(() => cells[index].classList.remove('completed'), 500);
            }

            const feeling = FEELINGS.find(f => f.id === selectedFeeling);
            setMessage(`✅ Perfect! ${feeling.emoji} ${feeling.label} goes here! +5 points`, true);

            // Check if all cells are colored
            const completed = checkCompletion();
            if (!completed) {
                // Deselect the feeling so they pick a new one
                selectedFeeling = null;
                renderPalette();
            }
        } else {
            // Wrong feeling!
            score = Math.max(0, score - 2);
            updateStats();
            const correct = FEELINGS.find(f => f.id === correctFeeling);
            const chosen = FEELINGS.find(f => f.id === selectedFeeling);
            setMessage(`❌ Oops! This square needs ${correct.emoji} ${correct.label}, not ${chosen.emoji} ${chosen.label}. -2 points`, false);

            // Shake the cell
            const cells = gridContainer.children;
            if (cells[index]) {
                cells[index].style.transform = 'translateX(-8px)';
                setTimeout(() => { cells[index].style.transform = 'translateX(8px)'; }, 100);
                setTimeout(() => { cells[index].style.transform = 'translateX(-8px)'; }, 200);
                setTimeout(() => { cells[index].style.transform = ''; }, 300);
            }
        }
    }

    // ---------- START A NEW ROUND ----------

    function startNewRound() {
        puzzle = generatePuzzle();
        cellStates = new Array(totalCells).fill('empty');
        coloredCount = 0;
        gameComplete = false;
        selectedFeeling = null;
        renderGrid();
        renderPalette();
        updateStats();
        setMessage(`🎯 Level ${level} - Match the feelings to the right colors!`, true);
    }

    // ---------- RESET / NEW GAME ----------

    function resetGame() {
        level = 1;
        score = 0;
        selectedFeeling = null;
        startNewRound();
        setMessage('🔄 New game started! Pick a feeling and color the squares!', true);
    }

    // ---------- HINT ----------

    function giveHint() {
        if (gameComplete) {
            setMessage('🎉 You already completed this round! Press "New Game".', false);
            return;
        }

        // Find the first empty cell
        const emptyIndex = cellStates.findIndex(state => state === 'empty');
        if (emptyIndex === -1) {
            setMessage('🎉 All cells are colored! Great job!', true);
            return;
        }

        const correct = puzzle[emptyIndex];
        const feeling = FEELINGS.find(f => f.id === correct);
        // Auto-select the correct feeling
        selectedFeeling = correct;
        renderPalette();
        // Flash the cell
        flashCell(emptyIndex);
        setMessage(`💡 Hint: Cell ${emptyIndex + 1} needs ${feeling.emoji} ${feeling.label}. It's already selected for you!`, true);
    }

    // ---------- EVENT LISTENERS ----------

    document.getElementById('newGameBtn').addEventListener('click', resetGame);
    document.getElementById('hintBtn').addEventListener('click', giveHint);

    // ---------- START THE GAME ----------

    // Initialize everything
    resetGame();

    console.log('🎨 Color & Feelings Adventure loaded! Grade 4 students, enjoy learning!');
    console.log('💡 Tip: Match the feeling emoji to the correct square.');
</script>
</body>
</html>
